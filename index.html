<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gentlerain.ai Clone</title>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>

<header class="nav">
  <div class="logo">GentleRain</div>
  <nav>
    <a href="#features">Features</a>
    <a href="#product">Product</a>
    <a href="#business">Business</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="water-layer"></div>
  <div class="hero-content">
    <h1>
      <span class="rotate">Practice</span><br>
      With AI
    </h1>
    <p>Learn. Play. Improve.</p>
  </div>
</section>

<!-- FEATURES -->
<section id="features" class="section">
  <h2 data-aos="fade-up">Features</h2>

  <div class="feature-grid">
    <div class="feature-card" data-aos="fade-up">
      <img src="assets/images/features.jpg" alt="">
      <h3>AI Practice</h3>
    </div>

    <div class="feature-card" data-aos="fade-up" data-aos-delay="100">
      <img src="assets/images/features.jpg" alt="">
      <h3>Smart Feedback</h3>
    </div>

    <div class="feature-card" data-aos="fade-up" data-aos-delay="200">
      <img src="assets/images/features.jpg" alt="">
      <h3>Gamified Learning</h3>
    </div>
  </div>
</section>

<!-- HORIZONTAL SCROLL -->
<section id="product" class="horizontal">
  <div class="panel">
    <img src="assets/images/download (1).jpg">
    <h3>Practice</h3>
  </div>

  <div class="panel">
    <img src="assets/images/download (1).jpg">
    <h3>Upskill</h3>
  </div>

  <div class="panel">
    <img src="assets/images/download (1).jpg">
    <h3>Play</h3>
  </div>

  <div class="panel">
    <img src="assets/images/download (2).jpg">
    <h3>Improve</h3>
  </div>
</section>

<!-- BUSINESS -->
<section id="business" class="section">
  <h2 data-aos="fade-up">For Business</h2>

  <div class="card-container">
    <div class="card">
      <div class="card-inner">
        <div class="card-front">Train Teams</div>
        <div class="card-back">
          <img src="assets/images/download (1).jpg">
          <p>AI-driven simulations</p>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-inner">
        <div class="card-front">Measure Skill</div>
        <div class="card-back">
          <img src="assets/images/download (1).jpg">
          <p>Real-time analytics</p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <p>© 2026 Gentlerain.ai Clone</p>
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>

<script src="js/main.js"></script>
<script src="js/gsap.js"></script>
<script src="js/text-rotate.js"></script>
</body>
</html>
